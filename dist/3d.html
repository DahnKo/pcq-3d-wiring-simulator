<!doctype html>
<html lang="ko">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <title>PCQ 3D 배선 실습</title>
 <link rel="stylesheet" href="3d.css">
 <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
 <header class="exam-header">
  <a href="index.html" class="back-link">기출 목록</a>
  <div class="problem-heading"><strong id="problem-title">PCQ 3D 배선 실습</strong><select id="problem-select" aria-label="기출문제 선택"></select></div>
  <div class="mode-select-wrap"><label for="mode-select">모드</label><select id="mode-select" aria-label="실습 모드 선택"><option value="exam">시험 모드</option><option value="practice">연습 모드</option></select></div>
  <div class="timer"><span id="clock-label">경과시간</span><output id="clock">00:00:00</output></div>
  <div class="exam-actions"><button id="start" class="primary">시작</button><button id="finish" disabled>완료</button><button id="grade" disabled>채점하기</button><button id="retry">다시 풀기</button></div>
 </header>
 <main id="split-layout">
  <section class="work pane" aria-label="3D 배선 작업판">
   <div id="viewport">
    <div id="instruction">시작 버튼을 눌러주세요</div>
    <div id="hover" role="status"></div>
    <div id="scene-tools">
     <button id="home" aria-label="기본 보기" title="기본 보기"><b>⌂</b><small>기본 보기</small></button>
     <button id="undo" aria-label="실행취소" title="실행취소 (Ctrl+Z)" disabled><b>↶</b><small>실행취소</small></button>
     <button id="redo" aria-label="다시 실행" title="다시 실행 (Ctrl+Y / Ctrl+Shift+Z)" disabled><b>↷</b><small>다시 실행</small></button>
     <button id="delete" aria-label="선택 삭제" title="선택한 전선 또는 케이블타이 삭제" disabled><b>⌫</b><small>선택 삭제</small></button>
     <button id="cancel" aria-label="현재 전선 취소" title="현재 전선 취소" disabled><b>×</b><small>현재 전선 취소</small></button>
    </div>
    <div id="material-shelf" aria-label="3D 재료함"></div>
    <div id="error-popover" hidden></div>
    <div id="status" role="status">회로도를 확인한 뒤 시작하세요.</div>
   </div>
  </section>
  <div id="splitter" role="separator" aria-label="작업판과 문제 자료 크기 조절" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="75" aria-valuenow="60" tabindex="0"><span></span></div>
  <aside class="pane" aria-label="문제 자료">
   <section id="viewer" aria-label="PDF 문제 뷰어">
    <div class="viewer-tab-row"><div class="viewer-tabs" role="tablist" aria-label="문제 페이지"><button data-page="5" class="active" role="tab" aria-selected="true">제어회로도</button><button data-page="6" role="tab" aria-selected="false">추가 결선도</button><button data-page="4" role="tab" aria-selected="false">배치도</button><button data-page="1" role="tab" aria-selected="false">규칙 1</button><button data-page="2" role="tab" aria-selected="false">규칙 2</button></div><button id="progress-toggle" type="button" aria-controls="progress-panel" aria-expanded="false" hidden><span id="progress-toggle-label">진행상황</span> <span id="progress-toggle-count">0/0</span></button></div>
    <div class="viewer-toolbar"><button id="zoomout" aria-label="축소" title="축소">−</button><output id="zoom-label">맞춤</output><button id="zoomin" aria-label="확대" title="확대">＋</button><button id="fit">맞춤</button><button id="rotate-ccw" aria-label="반시계방향 90도 회전">↶ 90°</button><button id="rotate-cw" aria-label="시계방향 90도 회전">↷ 90°</button><button id="rotate-180" aria-label="180도 회전">180°</button><button id="annotation-toggle" type="button" aria-pressed="false" title="제어회로도/추가 결선도에 메모">✎ 메모</button><button id="fullscreen">전체화면</button><button id="annotation-toolbar-toggle" type="button" aria-expanded="true" aria-controls="annotation-toolbar" title="메모 도구 탭 접기/펼치기">✏️ 접기</button><a id="original" href="assets/p01/5.webp" target="_blank" rel="noopener">원본</a></div>
    <div id="annotation-toolbar" class="annotation-toolbar" hidden>
     <div class="annotation-tool-group" role="group" aria-label="메모 도구"><button type="button" data-annotation-tool="highlighter" class="active">형광펜</button><button type="button" data-annotation-tool="marker">사인펜</button><button type="button" data-annotation-tool="eraser">지우개</button></div>
     <div id="annotation-colors" class="annotation-colors" role="group" aria-label="펜 색상"></div>
     <label class="annotation-range">두께 <input id="annotation-width" type="range" min="2" max="48" step="1"><output id="annotation-width-value"></output></label>
     <label id="annotation-opacity-control" class="annotation-range">불투명도 <input id="annotation-opacity" type="range" min="5" max="100" step="1"><output id="annotation-opacity-value"></output></label>
     <div class="annotation-actions"><button id="annotation-undo" type="button" title="메모 실행취소">↶</button><button id="annotation-redo" type="button" title="메모 다시 실행">↷</button><button id="annotation-clear" type="button">전체 삭제</button></div>
    </div>
    <div id="document" tabindex="0"><div id="page-stage"><img id="page" src="assets/p01/5.webp" alt="기출문제 원본 제어회로도" draggable="false"><svg id="annotation-layer" aria-label="도면 메모 레이어"></svg></div></div>
    <div id="annotation-eraser-cursor" aria-hidden="true"></div>
   </section>
   <details id="results" hidden><summary><span id="result-summary">채점 결과</span></summary><div id="errors"></div></details>
   <section id="progress-panel" aria-label="배선 진행상황" aria-hidden="true">
    <div class="progress-panel-head"><div><strong id="progress-panel-title">배선 진행상황</strong><small id="progress-panel-subtitle">정답 전선 순서가 아닌 전기적 NET 연결 기준</small></div><button id="progress-close" type="button" aria-label="진행상황 닫기">×</button></div>
    <div class="progress-overview"><div class="progress-score"><strong id="progress-score">0 / 0</strong><span>확정 NET 완료</span></div><div class="progress-track" aria-hidden="true"><i id="progress-bar"></i></div><div id="progress-stats" class="progress-stats"></div></div>
    <div class="progress-filters" role="group" aria-label="진행상황 필터"><button type="button" data-progress-filter="all" class="active">전체</button><button type="button" data-progress-filter="incomplete">미완료</button><button type="button" data-progress-filter="issues">오류·확인</button></div>
    <div id="progress-groups" class="progress-groups"></div>
   </section>
  </aside>
 </main>
 <dialog id="confirm"><h2>배선 작업 완료</h2><p>완료 후에는 배선을 수정할 수 없습니다.</p><div><button id="keepworking">취소</button><button id="confirmfinish" class="primary">완료</button></div></dialog>
 <dialog id="resume-dialog"><h2>진행 중인 실습이 있습니다.</h2><p>이어서 하시겠습니까?</p><div><button id="restart-saved">처음부터 하기</button><button id="resume-saved" class="primary">이어서 하기</button></div></dialog>
 <script type="module" src="3d-app.mjs"></script>
</body></html>
